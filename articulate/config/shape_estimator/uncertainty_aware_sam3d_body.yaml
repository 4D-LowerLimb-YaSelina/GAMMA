_target_: articulate.shape_estimator.uncertainty_aware_sam3d_body_estimator.UncertaintyAwareSAM3DShapeEstimator

device: ${device}

retry_iou_threshold: true
iou_retry_step: 0.1
min_iou_threshold: 0.0

sam3d_pkg_path: pkg/sam_3d_body
