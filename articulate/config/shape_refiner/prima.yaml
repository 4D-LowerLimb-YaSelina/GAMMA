_target_: articulate.shape_refiner.prima_smal_refiner.PRIMASMALShapeRefiner

device: ${device}

sigma_px: 5.0
conf_thresh: 1e-2
triangulation_iters: 2

optimize_keypoints: true
lr_keypoints: 1e-3
n_iters_keypoints: 1000

optimize_surface: true
n_views_surface: 3
merge_method: mean
lr_surface: 1e-2
n_iters_surface: 1000
bone_term_weight: 0.0
keypoint_term_weight: 0.0
src_to_tgt: true
src_subsample_num: 5000
tgt_subsample_num: 5000
