_target_: match.data.animer_smal_refusion.PostHocAniMerSMALRefusionDataset

dataset_name: smal_r
data_root: data/SMAL_r
articulated_shape_dir: output/smal_r_anchor
articulated_subdir: null
phase: test
return_faces: true
return_L: true
return_mass: true
num_evecs: 200
return_evecs: true
return_grad: true
return_corr: true
return_dist: true
split_category: true

artifact_root: ${.articulated_shape_dir}
animer_pkg_path: pkg/AniMer
checkpoint_path: pkg/AniMer/data/AniMer/checkpoints/checkpoint.ckpt
device: ${device}

minimum_iou: 0.0
view_residual_weights:
  surface: 1.0
  keypoint: 1.0
  iou: 1.0
  inlier: 1.0
view_temperature: 1.0
fusion_eps: 1e-8
use_visibility_in_vertex_confidence: true
