exp_name: becos-faust-partial-full/gt-fmap-sanity
random_seed: 0
deterministic: False
network:
    name: BeCoSGroundTruthFMap
    args: {}
train:
    script: TrainScript
    test_interval: 5
    checkpoint_interval: False
    save_best: geodist
    epochs: 30
    dataset:
        train:
            name: PairBeCoS
            args:
                data_root: /home/knpob/Documents/Lecun/repo/becos-code/output/faust_partial_full
                phase: train
                mode: partial_full
                return_faces: True
                return_L: False
                return_mass: True
                num_evecs: 200
                return_evecs: True
                return_grad: True
                return_corr: True
                return_dist: False
                compute_cache: True
                normalize_dist_by_area: True
            dataloader:
                name: BatchShapePairDataLoader
                args:
                    batch_size: 1
                    num_workers: 0
                    shuffle: True
        test:
            name: PairBeCoS
            args:
                data_root: /home/knpob/Documents/Lecun/repo/becos-code/output/faust_partial_full
                phase: test
                mode: partial_full
                return_faces: True
                return_L: False
                return_mass: True
                num_evecs: 200
                return_evecs: True
                return_grad: True
                return_corr: True
                return_dist: True
                compute_cache: True
                normalize_dist_by_area: True
            dataloader:
                name: BatchShapePairDataLoader
                args:
                    batch_size: 1
                    num_workers: 0
    loss:
        bij_loss:
            name: BijectivityLoss_f2p
            weight: 1.0
            args:
                avg_mode: True
        orth_loss:
            name: OrthogonalityLoss_f2p
            weight: 1.0
            args:
                avg_mode: True
        align_loss:
            name: SpatialSpectralAlignmentLoss
            weight: 1.0
            args:
                avg_mode: True
    metric:
        geodist:
            name: BeCoSGeodesicDist_PB
            args: {}
    optimizer:
        all:
            name: Adam
            args:
                lr: 1.0e-3
    scheduler:
        all:
            name: ConstantLR
            step_per_batch: False
            step_per_epoch: True
            args:
                factor: 1.0
                total_iters: 1
    gradient_clipping:
        max_norm: 1.0
