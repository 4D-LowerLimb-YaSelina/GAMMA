[project]
name = "fmap-baselines"
version = "0.0.1"
description = "Functional maps baselines"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "lightning>=2.0.0",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "torchmetrics>=0.11.4",
  "hydra-core==1.3.2",
  "hydra-colorlog==1.2.0",
  "hydra-optuna-sweeper==1.2.0",
  "rootutils",
  "rich",
  "numpy",
  "scipy",
  "scikit-learn",
  "trimesh",
  "networkx",
  "robust-laplacian",
  "potpourri3d",
  "open3d",
  "pyvista",
  "h5py",
  "tensorboard>=2.21",
  "matplotlib",
  "tqdm",
  "yacs>=0.1.8",
]

[project.scripts]
train_command = "src.train:main"
eval_command = "src.eval:main"

[dependency-groups]
dev = [
  "pre-commit",
  "pytest",
  "pytest-cov",
  "sh; sys_platform != 'win32'",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.uv.workspace]
members = [
    "test",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
